name: CI Pipeline

on:
  push:
    branches:
      - main  # Si tu veux que l'action se déclenche lors d'un push sur la branche 'main'
      - nom_prenom_librairie  # Si tu veux lier à ta branche spécifique nom_prenom_librairie

jobs:
  build:
    runs-on: ubuntu-latest  # Le système d'exploitation pour exécuter ton pipeline (ici Ubuntu)

    steps:
      # Étape 1: Checkout du code depuis GitHub
      - name: Checkout code
        uses: actions/checkout@v2

      # Étape 2: Configurer PHP et Composer (nécessaire pour Laravel)
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1.10'  # Spécifie la version de PHP à utiliser
          extensions: mbstring, bcmath, ctype, json, tokenizer, xml

      # Étape 3: Installer Composer
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      # Étape 4: Créer une image Docker
      - name: Set up Docker
        run: |
          docker build -t monimagedocker .  # Créer l'image Docker dans le répertoire actuel

      # Étape 5: Exécuter les tests (si tu en as)
      - name: Run Tests
        run: |
          ./vendor/bin/phpunit

      # Étape 6: Déclencher un webhook vers Jenkins
      - name: Send Webhook to Jenkins
        run: |
          curl -X POST https://ton-serveur-jenkins.local/job/ton-job-jenkins/build \
          --user "jenkins-user:jenkins-token"  # Remplace par tes informations Jenkins
